<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>關於 T-school</title>
<style>
body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
    font-size: 16px;
}
.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 20px;
    background-color: #fff;
    border-bottom: 1px solid #ddd;
}
.header .logo {
    display: flex;
    align-items: center;
}
.header .logo img {
    height: 50px;
    margin-right: 10px;
}
.header .logo-text {
    font-size: 18px;
    color: #003366;
}
.header .actions {
    display: flex;
    align-items: center;
}
.header .actions a {
    margin-left: 10px;
    text-decoration: none;
    color: #003366;
    font-size: 14px;
}
.header .social-icons img {
    height: 30px;
    margin-left: 10px;
}
.header .font-size-buttons button {
    margin-left: 5px;
    padding: 5px 10px;
    background-color: #ddd;
    border: none;
    cursor: pointer;
}
.navbar {
    background-color: #6ec1e4;
    overflow: hidden;
}
.navbar a, .navbar .dropbtn {
    float: left;
    display: block;
    color: white;
    text-align: center;
    padding: 14px 16px;
    text-decoration: none;
    font-size: inherit;
}
.navbar .dropdown {
    float: left;
    overflow: hidden;
}
.navbar .dropdown .dropbtn {
    border: none;
    outline: none;
    background-color: inherit;
    font-family: inherit;
    margin: 0;
}
.navbar .dropdown-content {
    display: none;
    position: absolute;
    background-color: #f9f9f9;
    min-width: 160px;
    box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.2);
    z-index: 1;
    margin-top: 0;
    top: 115px;
}
.navbar .dropdown-content a {
    float: none;
    color: black;
    padding: 12px 16px;
    text-decoration: none;
    display: block;
    text-align: left;
    font-size: inherit;
}
.navbar .dropdown-content a:hover {
    background-color: #ddd;
}
.navbar .dropdown:hover .dropdown-content {
    display: block;
}
.content {
    padding: 20px;
}
.content h1 {
    color: #003366;
}
.intro-box {
    background-color: #e0f7fa;
    padding: 20px;
    border-radius: 10px;
    margin: 20px 0;
}
.intro-box h2 {
    color: #00796b;
}
.intro-box p {
    line-height: 1.6;
    color: #004d40;
}
.intro-box img {
    max-width: 300px;
    margin-left: 20px;
    border-radius: 10px;
}
</style>
</head>
<body>

<div class="header">
    <div class="logo">
        <img src="logo.png" alt="T-School Logo">
        <div class="logo-text">
            <div>臺北市數位實驗高級中等學校</div>
            <div>Taipei Digital Experimental High School</div>
        </div>
    </div>
    <div class="actions">
        <a href="index.html">首頁</a>
        <a href="#login">登入</a>
        <a href="#guide">導覽</a>
        <div class="font-size-buttons">
            <button onclick="setFontSize('small')">小</button>
            <button onclick="setFontSize('medium')">中</button>
            <button onclick="setFontSize('large')">大</button>
        </div>
        <div class="social-icons">
            <img src="facebook.png" alt="Facebook">
            <img src="youtube.png" alt="YouTube">
            <img src="line.png" alt="LINE">
        </div>
    </div>
</div>

<div class="navbar">
    <a href="about.html">關於 T-school</a>
    <div class="dropdown">
        <button class="dropbtn">行政團隊</button>
        <div class="dropdown-content">
            <a href="#duties">業務職掌</a>
            <a href="#structure">組織架構</a>
        </div>
    </div>
    <div class="dropdown">
        <button class="dropbtn">課程介紹</button>
        <div class="dropdown-content">
            <a href="#course-introduction">課程介紹</a>
            <a href="#self-development">自我發展</a>
            <a href="#culture">文化社會</a>
            <a href="#knowledge">學科知識</a>
            <a href="#individual-needs">個別需求</a>
            <a href="#graduation-project">畢業專題</a>
        </div>
    </div>
    <div class="dropdown">
        <button class="dropbtn">校園公告</button>
        <div class="dropdown-content">
            <a href="#announcements">校園公告</a>
            <a href="#gender-equality">性別平等專區</a>
            <a href="#disaster-education">防災教育專區</a>
            <a href="#friendly-campus">友善校園</a>
            <a href="#international-education">國際教育專區</a>
            <a href="#quality-school">優質學校專區</a>
        </div>
    </div>
    <div class="dropdown">
        <button class="dropbtn">學生專區</button>
        <div class="dropdown-content">
            <a href="#course-selection">課程選課</a>
            <a href="#file-area">檔案專區</a>
            <a href="#guidance">輔導資訊</a>
            <a href="#learning-resources">學習歷程檔案資源站</a>
            <a href="#digital-platform">數位平臺</a>
        </div>
    </div>
    <a href="#admissions">招生專區</a>
    <a href="#partners">夥伴招募</a>
</div>

<div class="content">
   
</div>

<script>
function setFontSize(size) {
    let fontSize;
    switch(size) {
        case 'small':
            fontSize = '12px';
            break;
        case 'medium':
            fontSize = '16px';
            break;
        case 'large':
            fontSize = '20px';
            break;
    }
    document.body.style.fontSize = fontSize;
    const elements = document.querySelectorAll('.navbar a, .navbar .dropbtn, .navbar .dropdown-content a');
    elements.forEach(element => {
        element.style.fontSize = fontSize;
    });
}
</script>

</body>
</html>
